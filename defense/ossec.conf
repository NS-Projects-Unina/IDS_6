<ossec_config>
  <client>
    <server>
      <address>10.0.2.30</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
  </client>

  <!-- Lettura eve.json di Suricata: l'agent defense riporta gli alert al manager -->
  <!-- Questo permette a location:local nell'AR di eseguire iptables sul container corretto -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
    <label key="@source">suricata</label>
  </localfile>

</ossec_config>
